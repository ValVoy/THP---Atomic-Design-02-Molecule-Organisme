<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootswatch/4.5.2/darkly/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <title>Tarifs - Eventbrite</title>
</head>
<body>
    <div class="container mt-5 text-center">
        <h2 class="mb-5 display-4">Nos Offres Organiseurs</h2>
        <div class="card-deck">
            <div class="card shadow">
                <div class="card-header bg-secondary"><h4>Standard</h4></div>
                <div class="card-body">
                    <h1 class="card-title">0€ <small class="text-muted">/ mois</small></h1>
                    <ul class="list-unstyled mt-3 mb-4">
                        <li>Événements gratuits illimités</li>
                        <li>Commission 10% sur ventes</li>
                        <li>Support par email</li>
                    </ul>
                    <button class="btn btn-lg btn-block btn-outline-primary">Commencer</button>
                </div>
            </div>
            <div class="card shadow border-primary">
                <div class="card-header bg-primary"><h4>Pro</h4></div>
                <div class="card-body">
                    <h1 class="card-title">29€ <small class="text-muted">/ mois</small></h1>
                    <ul class="list-unstyled mt-3 mb-4">
                        <li>Événements payants illimités</li>
                        <li>Commission 2% sur ventes</li>
                        <li>Support prioritaire 24/7</li>
                    </ul>
                    <button class="btn btn-lg btn-block btn-primary">Choisir Pro</button>
                </div>
            </div>
        </div>
    </div>
    <a href="index.html" class="btn btn-secondary back-to-hub">← Hub</a>
</body>
</html>
