<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootswatch/4.5.2/darkly/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <title>Détails de l'événement - Eventbrite</title>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <img src="https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800" class="img-fluid rounded shadow" alt="Event">
                <div class="mt-4">
                    <h3>Description</h3>
                    <p>Venez participer au plus grand rassemblement tech de l'année. Des conférences, des ateliers et du networking de haut niveau vous attendent dans un cadre prestigieux.</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card p-4 shadow-sm border-primary">
                    <h2 class="h4">Festival Tech 2026</h2>
                    <p class="text-primary font-weight-bold">25€ - 50€</p>
                    <hr class="bg-secondary">
                    <div class="mb-3">
                        <i class="fas fa-calendar-alt text-info"></i> <span class="ml-2">14 Mars 2026</span><br>
                        <i class="fas fa-clock text-info"></i> <span class="ml-2">19:00 - 23:00</span>
                    </div>
                    <div class="mb-4">
                        <i class="fas fa-map-marker-alt text-danger"></i> <span class="ml-2">Le Cargo, Paris</span>
                    </div>
                    <button class="btn btn-primary btn-block btn-lg">Prendre mon billet</button>
                    <div class="mt-3 text-center">
                        <i class="fab fa-facebook mr-3"></i>
                        <i class="fab fa-twitter mr-3"></i>
                        <i class="fab fa-instagram"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <a href="index.html" class="btn btn-secondary back-to-hub">← Hub</a>
</body>
</html>
